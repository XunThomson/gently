<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>音乐律动可视化</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; min-height: 100%;
            background: radial-gradient(1200px 600px at 50% -10%, #12121a 0%, #0a0a0d 60%);
            color: #eaeaea;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 24px;
        }
        canvas {
            width: min(90vw, 520px);
            aspect-ratio: 1 / 1;
            max-height: 62vh;
            background: radial-gradient(circle at 50% 50%, #0b0b14 0%, #05050a 70%);
            border-radius: 20px;
            box-shadow: 0 0 0 1px #1e1e26, 0 20px 60px rgba(0,0,0,.75);
            display: block;
        }
        .bar { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 11px 26px; border: 0; border-radius: 999px;
            background: #3b82f6; color: #fff; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: background .18s, transform .06s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background: #2563eb; }
        button:active:not(:disabled) { transform: scale(.97); }
        button:disabled { background: #26262e; color: #5a5a66; cursor: not-allowed; }
        button.danger { background: #ef4444; }
        button.danger:hover:not(:disabled) { background: #dc2626; }
        #tip {
            margin-top: 16px; font-size: 13.5px; color: #8a8a96;
            text-align: center; max-width: 780px; line-height: 1.7;
        }
        #tip b { color: #c4c4d0; font-weight: 600; }
        kbd {
            background: #1c1c24; border: 1px solid #2e2e38; border-bottom-width: 2px;
            border-radius: 5px; padding: 1px 6px; font-size: 12px; color: #c8c8d4;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="bar">
    <button id="btnSys">捕获电脑声音</button>
    <button id="btnMic">使用麦克风</button>
    <button id="btnStop" class="danger" disabled>停止</button>
</div>

<div id="tip">
    点击「捕获电脑声音」→ 在弹窗中选一个正在播放音乐/视频的
    <b>标签页</b>（勾选「分享标签页音频」）或 <b>整个屏幕</b>（勾选「分享系统音频」）。
</div>

<script>
    (() => {
        'use strict';

        /* ================= DOM ================= */
        const canvas  = document.getElementById('cv');
        const ctx     = canvas.getContext('2d');
        const btnSys  = document.getElementById('btnSys');
        const btnMic  = document.getElementById('btnMic');
        const btnStop = document.getElementById('btnStop');
        const tip     = document.getElementById('tip');

        /* ================= 配置 ================= */
        const BARS       = 96;      // 环形频谱柱数量
        const FFT_SIZE   = 2048;    // 频域 bin 数 = 1024
        const SMOOTH_T   = 0.7;     // AnalyserNode 自带平滑
        const SILENT_TH  = 3;       // 时域最大偏移 < 此值 → 静音
        const GAIN       = 1.45;    // 频谱增益
        const LOW_BINS   = 8;       // 用于"低音脉冲"的 bin 数量

        /* ================= 状态 ================= */
        let W = 0, H = 0;
        let audioCtx = null, analyser = null, source = null;
        let freqBuf = null, timeBuf = null;
        let stream = null;
        let running = false;
        let rafId = 0;

        const barValues = new Float32Array(BARS);   // 当前柱高 0..1
        const barPeaks  = new Float32Array(BARS);   // 峰值保持
        let   barBins   = [];

        let curLow = 0;                              // 平滑后的低音能量 0..1
        const ringPhases = [0, 0.33, 0.66];          // 扩散波纹的相位 0..1

        /* ================= 画布尺寸 ================= */
        function resize() {
            const dpr  = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            W = Math.max(1, rect.width);
            H = Math.max(1, rect.height);
            canvas.width  = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (!running) drawIdle();
        }

        /* ================= 对数分箱：低频更细、高频更粗 ================= */
        function computeBins(binCount) {
            barBins = [];
            const minBin = 1;
            const maxBin = binCount - 1;
            const logMin = Math.log(minBin);
            const logMax = Math.log(maxBin);
            for (let i = 0; i < BARS; i++) {
                const t0 = i / BARS;
                const t1 = (i + 1) / BARS;
                let s = Math.floor(Math.exp(logMin + (logMax - logMin) * t0));
                let e = Math.floor(Math.exp(logMin + (logMax - logMin) * t1));
                if (s < minBin) s = minBin;
                if (e <= s) e = s + 1;
                if (e > binCount) e = binCount;
                barBins.push([s, e]);
            }
        }

        /* ================= 静音 / 未开始时的静止画面 ================= */
        function drawIdle() {
            ctx.clearRect(0, 0, W, H);

            const cx = W / 2, cy = H / 2;
            const R  = Math.min(W, H);
            const baseR = R * 0.17;

            // 中心微光
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.6);
            g.addColorStop(0, 'rgba(59,130,246,0.10)');
            g.addColorStop(1, 'rgba(59,130,246,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(cx, cy, baseR * 1.6, 0, Math.PI * 2);
            ctx.fill();

            // 空心圆环
            ctx.beginPath();
            ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
            ctx.strokeStyle = '#2a2a35';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 中心小点
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#3b82f6';
            ctx.fill();
        }

        /* ================= 绘制律动画面 ================= */
        function drawLive() {
            ctx.clearRect(0, 0, W, H);

            const cx = W / 2, cy = H / 2;
            const R  = Math.min(W, H);
            const baseR  = R * 0.17;
            const maxLen = R * 0.30;

            // 中心圆半径：随低音脉冲放大
            const pulseR = baseR * (1 + curLow * 0.55);

            /* ---- 1. 背景径向光晕（随低音变亮） ---- */
            const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.52);
            bg.addColorStop(0, `rgba(59,130,246,${0.10 + curLow * 0.20})`);
            bg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            /* ---- 2. 向外扩散的波纹环 ---- */
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let k = 0; k < ringPhases.length; k++) {
                const p = ringPhases[k];
                const r = pulseR + p * (maxLen * 1.55);
                const alpha = (1 - p) * (0.10 + curLow * 0.40);
                if (alpha > 0.005) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(99,179,237,${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            ctx.restore();

            /* ---- 3. 环形频谱柱 ---- */
            // 每根柱的角度间隔对应的弧长，作为线宽基准
            const slot = (Math.PI * 2 * pulseR) / BARS;
            const barW = Math.max(1.4, slot * 0.72);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';

            for (let i = 0; i < BARS; i++) {
                const angle = (i / BARS) * Math.PI * 2 - Math.PI / 2;
                const ca = Math.cos(angle);
                const sa = Math.sin(angle);

                const v   = barValues[i];
                const len = v * maxLen + 2;

                const x1 = cx + ca * pulseR;
                const y1 = cy + sa * pulseR;
                const x2 = cx + ca * (pulseR + len);
                const y2 = cy + sa * (pulseR + len);

                // 颜色沿圆周渐变：青 → 蓝 → 紫 → 粉
                const hue   = 195 + (i / BARS) * 145;
                const light = 48 + v * 24;

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `hsla(${hue}, 92%, ${light}%, ${0.35 + v * 0.65})`;
                ctx.lineWidth = barW;
                ctx.shadowColor = `hsla(${hue}, 95%, 62%, 0.85)`;
                ctx.shadowBlur = 6 + v * 16;
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            /* ---- 4. 柱末端亮点（峰值） ---- */
            for (let i = 0; i < BARS; i++) {
                const pv = barPeaks[i];
                if (pv < 0.06) continue;

                const angle = (i / BARS) * Math.PI * 2 - Math.PI / 2;
                const ca = Math.cos(angle);
                const sa = Math.sin(angle);
                const r  = pulseR + pv * maxLen + 5;

                const px = cx + ca * r;
                const py = cy + sa * r;
                const hue = 195 + (i / BARS) * 145;

                ctx.beginPath();
                ctx.arc(px, py, 1.8, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, 85%, ${0.35 + pv * 0.6})`;
                ctx.fill();
            }
            ctx.restore();

            /* ---- 5. 中心圆：发光外圈 + 实心内核 ---- */
            // 外发光
            const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, pulseR * 1.25);
            glow.addColorStop(0, `rgba(255,255,255,${0.85 + curLow * 0.15})`);
            glow.addColorStop(0.35, `rgba(96,165,250,${0.45 + curLow * 0.35})`);
            glow.addColorStop(1, 'rgba(59,130,246,0)');
            ctx.beginPath();
            ctx.arc(cx, cy, pulseR * 1.25, 0, Math.PI * 2);
            ctx.fillStyle = glow;
            ctx.fill();

            // 实心内核
            ctx.beginPath();
            ctx.arc(cx, cy, pulseR * 0.62, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(8,8,16,0.92)';
            ctx.fill();

            // 内核描边
            ctx.beginPath();
            ctx.arc(cx, cy, pulseR * 0.62, 0, Math.PI * 2);
            ctx.strokeStyle = `hsla(210, 95%, ${62 + curLow * 22}%, 0.95)`;
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(96,165,250,0.9)';
            ctx.shadowBlur = 12 + curLow * 20;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 内核中心亮点
            ctx.beginPath();
            ctx.arc(cx, cy, 2.5 + curLow * 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,255,255,${0.7 + curLow * 0.3})`;
            ctx.fill();
        }

        /* ================= 主循环 ================= */
        function loop() {
            if (!running) return;
            rafId = requestAnimationFrame(loop);

            if (!analyser || !freqBuf || !timeBuf) return;

            analyser.getByteFrequencyData(freqBuf);
            analyser.getByteTimeDomainData(timeBuf);

            /* ---- 1. 时域静音判断 ---- */
            let maxDev = 0;
            for (let i = 0; i < timeBuf.length; i++) {
                const d = Math.abs(timeBuf[i] - 128);
                if (d > maxDev) maxDev = d;
            }
            const silent = maxDev < SILENT_TH;

            /* ---- 2. 低音能量（驱动中心脉冲与波纹） ---- */
            let lowSum = 0, lowN = 0;
            const lowEnd = Math.min(LOW_BINS, freqBuf.length - 1);
            for (let i = 1; i <= lowEnd; i++) {
                lowSum += freqBuf[i];
                lowN++;
            }
            const lowEnergy = lowN > 0 ? (lowSum / lowN) / 255 : 0;
            const lowTarget = silent ? 0 : Math.pow(lowEnergy, 0.9);
            curLow += (lowTarget - curLow) * 0.18;
            if (curLow < 0.001) curLow = 0;

            /* ---- 3. 波纹相位推进（随低音加速） ---- */
            const speed = 0.0025 + curLow * 0.013;
            for (let k = 0; k < ringPhases.length; k++) {
                ringPhases[k] += speed;
                if (ringPhases[k] >= 1) ringPhases[k] -= 1;
            }

            /* ---- 4. 更新每根频谱柱 ---- */
            for (let i = 0; i < BARS; i++) {
                const [s, e] = barBins[i];
                let sum = 0;
                for (let j = s; j < e; j++) sum += freqBuf[j];

                let target = (sum / (e - s)) / 255;
                target = Math.pow(target, 0.82) * GAIN;   // 提亮中低音量
                if (target > 1) target = 1;
                if (silent) target = 0;

                // 上升快、下降慢
                const k = target > barValues[i] ? 0.65 : 0.14;
                barValues[i] += (target - barValues[i]) * k;
                if (barValues[i] < 0.001) barValues[i] = 0;

                // 峰值保持 + 缓慢下落
                if (barValues[i] >= barPeaks[i]) {
                    barPeaks[i] = barValues[i];
                } else {
                    barPeaks[i] -= 0.006;
                    if (barPeaks[i] < barValues[i]) barPeaks[i] = barValues[i];
                    if (barPeaks[i] < 0) barPeaks[i] = 0;
                }
            }

            /* ---- 5. 判断是否有能量在动 ---- */
            let moved = curLow > 0.01;
            if (!moved) {
                for (let i = 0; i < BARS; i++) {
                    if (barValues[i] > 0.01) { moved = true; break; }
                }
            }

            if (moved) drawLive();
            else drawIdle();
        }

        /* ================= 启动 ================= */
        async function startCapture(type) {
            if (running) return;

            btnSys.disabled = true;
            btnMic.disabled = true;
            tip.textContent = '正在等待你选择共享内容…';

            try {
                if (type === 'display') {
                    stream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,   // 必须为 true，否则部分浏览器不弹选择框
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    // 丢弃视频，只留音频
                    stream.getVideoTracks().forEach(t => {
                        try { t.stop(); } catch (_) {}
                    });
                } else {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                }
            } catch (err) {
                btnSys.disabled = false;
                btnMic.disabled = false;
                if (err && err.name === 'NotAllowedError') {
                    tip.innerHTML = '操作被取消。请重新点击，并在弹窗中选择 <b>标签页</b> 或 <b>整个屏幕</b>。';
                } else {
                    tip.innerHTML = '获取失败：' + (err && err.message ? err.message : err);
                }
                return;
            }

            // 检查音频轨道
            const audioTracks = stream.getAudioTracks().filter(t => t.readyState === 'live');
            if (audioTracks.length === 0) {
                cleanupStream();
                btnSys.disabled = false;
                btnMic.disabled = false;
                tip.innerHTML =
                    '没有获取到音频。请重新点击，并在共享弹窗中：<br>' +
                    '• 选择 <b>整个屏幕</b> 并勾选 <b>「分享系统音频」</b>，或<br>' +
                    '• 选择 <b>某个标签页</b> 并勾选 <b>「分享标签页音频」</b>。';
                return;
            }

            // 用户点浏览器自带「停止共享」时收尾
            audioTracks.forEach(track => {
                track.addEventListener('ended', () => {
                    if (running) stop('共享已结束。');
                });
            });

            // 构建音频图
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                const audioStream = new MediaStream(audioTracks);
                source   = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = FFT_SIZE;
                analyser.smoothingTimeConstant = SMOOTH_T;

                freqBuf = new Uint8Array(analyser.frequencyBinCount);
                timeBuf = new Uint8Array(analyser.fftSize);

                computeBins(analyser.frequencyBinCount);

                // 关键：只连 analyser，不连 destination，避免二次输出产生回声
                source.connect(analyser);
            } catch (err) {
                cleanupAll();
                btnSys.disabled = false;
                btnMic.disabled = false;
                tip.textContent = '音频初始化失败：' + (err && err.message ? err.message : err);
                return;
            }

            // 重置状态
            barValues.fill(0);
            barPeaks.fill(0);
            curLow = 0;
            ringPhases[0] = 0;
            ringPhases[1] = 0.33;
            ringPhases[2] = 0.66;

            running = true;
            btnSys.disabled = true;
            btnMic.disabled = true;
            btnStop.disabled = false;
            tip.innerHTML =
                '正在监听… 播放音乐感受 <b>低频脉冲 + 环形频谱</b> 的律动吧。<br>' +
                '静音时画面会自动归于平静。';

            cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(loop);
        }

        /* ================= 停止 ================= */
        function stop(reason) {
            running = false;
            cancelAnimationFrame(rafId);
            rafId = 0;

            cleanupAll();

            barValues.fill(0);
            barPeaks.fill(0);
            curLow = 0;

            btnSys.disabled = false;
            btnMic.disabled = false;
            btnStop.disabled = true;

            drawIdle();

            if (typeof reason === 'string' && reason) {
                tip.textContent = reason;
            } else {
                tip.innerHTML = '已停止。可以再次点击按钮重新开始。';
            }
        }

        /* ================= 清理 ================= */
        function cleanupStream() {
            if (stream) {
                stream.getTracks().forEach(t => {
                    try { t.stop(); } catch (_) {}
                });
                stream = null;
            }
        }
        function cleanupAll() {
            cleanupStream();
            if (audioCtx) {
                audioCtx.close().catch(() => {});
                audioCtx = null;
            }
            analyser = null;
            source = null;
            freqBuf = null;
            timeBuf = null;
        }

        /* ================= 事件绑定 ================= */
        btnSys.addEventListener('click', () => startCapture('display'));
        btnMic.addEventListener('click', () => startCapture('mic'));
        btnStop.addEventListener('click', () => stop());
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);

        /* ================= 初始化 ================= */
        resize();
        drawIdle();

        // 环境检测
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            btnSys.disabled = true;
            tip.innerHTML =
                '当前浏览器不支持 <b>getDisplayMedia</b>。<br>' +
                '请使用 <b>Chrome / Edge</b>，并在 <kbd>https</kbd> 或 <kbd>localhost</kbd> 环境下打开。';
        }
    })();
</script>
</body>
</html>
