<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>电平波形 Demo</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; min-height: 100%;
            background: radial-gradient(1200px 600px at 50% -10%, #12121a 0%, #0a0a0d 60%);
            color: #eaeaea;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 24px;
        }
        canvas {
            width: min(94vw, 920px);
            height: 280px;
            background: #06060a;
            border-radius: 16px;
            box-shadow: 0 0 0 1px #1e1e26, 0 20px 60px rgba(0,0,0,.7);
            display: block;
        }
        .bar { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        button {
            padding: 11px 26px; border: 0; border-radius: 999px;
            background: #3b82f6; color: #fff; font-size: 15px; font-weight: 500;
            cursor: pointer; transition: background .18s, transform .06s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background: #2563eb; }
        button:active:not(:disabled) { transform: scale(.97); }
        button:disabled { background: #26262e; color: #5a5a66; cursor: not-allowed; }
        button.danger { background: #ef4444; }
        button.danger:hover:not(:disabled) { background: #dc2626; }
        #tip {
            margin-top: 16px; font-size: 13.5px; color: #8a8a96;
            text-align: center; max-width: 780px; line-height: 1.7;
        }
        #tip b { color: #c4c4d0; font-weight: 600; }
        kbd {
            background: #1c1c24; border: 1px solid #2e2e38; border-bottom-width: 2px;
            border-radius: 5px; padding: 1px 6px; font-size: 12px; color: #c8c8d4;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="bar">
    <button id="btnSys">捕获电脑声音</button>
    <button id="btnMic">使用麦克风</button>
    <button id="btnStop" class="danger" disabled>停止</button>
</div>

<div id="tip">
    点击「捕获电脑声音」→ 在弹窗中选一个正在播放音乐/视频的
    <b>标签页</b>（勾选「分享标签页音频」）或 <b>整个屏幕</b>（勾选「分享系统音频」）。
</div>

<script>
    (() => {
        'use strict';

        /* ================= DOM ================= */
        const canvas  = document.getElementById('cv');
        const ctx     = canvas.getContext('2d');
        const btnSys  = document.getElementById('btnSys');
        const btnMic  = document.getElementById('btnMic');
        const btnStop = document.getElementById('btnStop');
        const tip     = document.getElementById('tip');

        /* ================= 配置 ================= */
        const BARS       = 64;      // 电平条数量
        const FFT_SIZE   = 2048;    // 频域 bin 数 = 1024
        const SMOOTH_T   = 0.6;     // AnalyserNode 自带平滑
        const SILENT_TH  = 3;       // 时域最大偏移 < 此值 → 静音
        const MAX_GAIN   = 1.8;     // 频域显示增益
        const GAP        = 2;       // 条间距（px）

        /* ================= 状态 ================= */
        let W = 0, H = 0;
        let audioCtx = null, analyser = null, source = null;
        let freqBuf = null, timeBuf = null;
        let stream = null;
        let running = false;
        let rafId = 0;

        // 每个条的状态
        const barValues   = new Float32Array(BARS); // 当前值 0..1
        const barPeaks    = new Float32Array(BARS); // 峰值 0..1
        const barPeakVel  = new Float32Array(BARS); // 峰值下落速度
        let   barBins     = [];                     // 对数分箱 [{s,e},...]

        /* ================= 画布尺寸 ================= */
        function resize() {
            const dpr  = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            W = Math.max(1, rect.width);
            H = Math.max(1, rect.height);
            canvas.width  = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (!running) drawSilence();
        }

        /* ================= 对数分箱（低频更细，高频更粗） ================= */
        function computeBins(binCount) {
            barBins = [];
            const minBin = 1;
            const maxBin = binCount - 1;
            const logMin = Math.log(minBin);
            const logMax = Math.log(maxBin);
            for (let i = 0; i < BARS; i++) {
                const t0 = i / BARS;
                const t1 = (i + 1) / BARS;
                let s = Math.floor(Math.exp(logMin + (logMax - logMin) * t0));
                let e = Math.floor(Math.exp(logMin + (logMax - logMin) * t1));
                if (s < minBin) s = minBin;
                if (e <= s) e = s + 1;
                if (e > binCount) e = binCount;
                barBins.push([s, e]);
            }
        }

        /* ================= 顶部圆角矩形路径 ================= */
        function topRoundRect(x, y, w, h, r) {
            r = Math.min(r, w / 2, h);
            ctx.beginPath();
            ctx.moveTo(x, y + h);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
        }

        /* ================= 绘制：静音直线 ================= */
        function drawSilence() {
            ctx.clearRect(0, 0, W, H);

            const baseY = H - 24;
            const topY  = 24;

            // 水平参考网格
            ctx.strokeStyle = '#15151c';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                const y = topY + (baseY - topY) * i / 4;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // 静音主体直线
            ctx.beginPath();
            ctx.moveTo(0, baseY);
            ctx.lineTo(W, baseY);
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        /* ================= 绘制：电平波形 ================= */
        function drawBars() {
            ctx.clearRect(0, 0, W, H);

            const baseY = H - 24;
            const topY  = 24;
            const maxH  = baseY - topY;

            // 水平参考网格
            ctx.strokeStyle = '#15151c';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                const y = topY + maxH * i / 4;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            const barW = Math.max(1, (W - GAP * (BARS - 1)) / BARS);
            let any = false;

            for (let i = 0; i < BARS; i++) {
                const v = barValues[i];
                if (v > 0.005) any = true;

                const h = v * maxH;
                const x = i * (barW + GAP);
                const y = baseY - h;

                // 柱子（有高度才画）
                if (h > 0.5) {
                    const hue = 210 - v * 150; // 蓝 → 青 → 黄绿
                    const grad = ctx.createLinearGradient(0, baseY, 0, y);
                    grad.addColorStop(0, `hsla(${hue}, 85%, 45%, 0.9)`);
                    grad.addColorStop(1, `hsla(${hue}, 95%, 68%, 1)`);
                    ctx.fillStyle = grad;
                    topRoundRect(x, y, barW, h, 3);
                    ctx.fill();
                }

                // 峰值保持线
                const p = barPeaks[i];
                if (p > 0.01 && p * maxH > 1) {
                    const py = baseY - p * maxH;
                    ctx.fillStyle = 'rgba(255,255,255,0.75)';
                    ctx.fillRect(x, py - 2, barW, 2);
                }
            }

            // 基线
            ctx.beginPath();
            ctx.moveTo(0, baseY);
            ctx.lineTo(W, baseY);
            if (any) {
                ctx.strokeStyle = '#2a2a35';
                ctx.lineWidth = 1;
            } else {
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
            }
            ctx.stroke();
        }

        /* ================= 主循环 ================= */
        function loop() {
            if (!running) return;
            rafId = requestAnimationFrame(loop);

            if (!analyser || !freqBuf || !timeBuf) return;

            analyser.getByteFrequencyData(freqBuf);
            analyser.getByteTimeDomainData(timeBuf);

            // 1) 时域判断是否静音
            let maxDev = 0;
            for (let i = 0; i < timeBuf.length; i++) {
                const d = Math.abs(timeBuf[i] - 128);
                if (d > maxDev) maxDev = d;
            }
            const silent = maxDev < SILENT_TH;

            // 2) 更新每个条
            if (silent) {
                for (let i = 0; i < BARS; i++) {
                    barValues[i] *= 0.75;
                    if (barValues[i] < 0.003) barValues[i] = 0;
                    barPeaks[i] *= 0.9;
                    if (barPeaks[i] < 0.005) barPeaks[i] = 0;
                }
            } else {
                for (let i = 0; i < BARS; i++) {
                    const [s, e] = barBins[i];
                    let sum = 0;
                    for (let j = s; j < e; j++) sum += freqBuf[j];
                    const avg = sum / (e - s) / 255;

                    let target = Math.pow(avg, 0.85) * MAX_GAIN;
                    if (target > 1) target = 1;

                    // 上升快、下降慢
                    if (target > barValues[i]) {
                        barValues[i] = barValues[i] * 0.3 + target * 0.7;
                    } else {
                        barValues[i] = barValues[i] * 0.8 + target * 0.2;
                    }

                    // 峰值保持
                    if (barValues[i] >= barPeaks[i]) {
                        barPeaks[i] = barValues[i];
                        barPeakVel[i] = 0;
                    } else {
                        barPeakVel[i] += 0.0018;
                        barPeaks[i] -= barPeakVel[i];
                        if (barPeaks[i] < barValues[i]) {
                            barPeaks[i] = barValues[i];
                            barPeakVel[i] = 0;
                        }
                        if (barPeaks[i] < 0) barPeaks[i] = 0;
                    }
                }
            }

            // 3) 绘制
            let any = false;
            for (let i = 0; i < BARS; i++) {
                if (barValues[i] > 0.005) { any = true; break; }
            }
            if (any) drawBars();
            else drawSilence();
        }

        /* ================= 启动 ================= */
        async function startCapture(type) {
            if (running) return;

            btnSys.disabled = true;
            btnMic.disabled = true;
            tip.textContent = '正在等待你选择共享内容…';

            try {
                if (type === 'display') {
                    stream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,  // 必须为 true，否则部分浏览器不弹选择框
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    // 丢弃视频，只保留声音
                    stream.getVideoTracks().forEach(t => {
                        try { t.stop(); } catch (_) {}
                    });
                } else {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                }
            } catch (err) {
                btnSys.disabled = false;
                btnMic.disabled = false;
                if (err && err.name === 'NotAllowedError') {
                    tip.innerHTML = '操作被取消。请重新点击，并在弹窗中选择 <b>标签页</b> 或 <b>整个屏幕</b>。';
                } else {
                    tip.innerHTML = '获取失败：' + (err && err.message ? err.message : err);
                }
                return;
            }

            // 检查音频轨道
            const audioTracks = stream.getAudioTracks().filter(t => t.readyState === 'live');
            if (audioTracks.length === 0) {
                cleanupStream();
                btnSys.disabled = false;
                btnMic.disabled = false;
                tip.innerHTML =
                    '没有获取到音频。请重新点击，并在共享弹窗中：<br>' +
                    '• 选择 <b>整个屏幕</b> 并勾选 <b>「分享系统音频」</b>，或<br>' +
                    '• 选择 <b>某个标签页</b> 并勾选 <b>「分享标签页音频」</b>。';
                return;
            }

            // 用户点浏览器自带「停止共享」时收尾
            audioTracks.forEach(track => {
                track.addEventListener('ended', () => {
                    if (running) stop('共享已结束。');
                });
            });

            // 构建音频图
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                await audioCtx.resume();

                const audioStream = new MediaStream(audioTracks);
                source   = audioCtx.createMediaStreamSource(audioStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = FFT_SIZE;
                analyser.smoothingTimeConstant = SMOOTH_T;

                freqBuf = new Uint8Array(analyser.frequencyBinCount);
                timeBuf = new Uint8Array(analyser.fftSize);

                computeBins(analyser.frequencyBinCount);

                // 关键：只连 analyser，不要连 destination，否则会二次输出产生回声
                source.connect(analyser);
            } catch (err) {
                cleanupAll();
                btnSys.disabled = false;
                btnMic.disabled = false;
                tip.textContent = '音频初始化失败：' + (err && err.message ? err.message : err);
                return;
            }

            // 重置状态
            barValues.fill(0);
            barPeaks.fill(0);
            barPeakVel.fill(0);

            running = true;
            btnSys.disabled = true;
            btnMic.disabled = true;
            btnStop.disabled = false;
            tip.innerHTML =
                '正在监听… 静音时显示一条直线，有声音时显示 <b>电平波形</b>。<br>' +
                '现在去别的标签页或播放器里播放音乐/视频吧。';

            cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(loop);
        }

        /* ================= 停止 ================= */
        function stop(reason) {
            running = false;
            cancelAnimationFrame(rafId);
            rafId = 0;

            cleanupAll();

            barValues.fill(0);
            barPeaks.fill(0);
            barPeakVel.fill(0);

            btnSys.disabled = false;
            btnMic.disabled = false;
            btnStop.disabled = true;

            drawSilence();

            if (typeof reason === 'string' && reason) {
                tip.textContent = reason;
            } else {
                tip.innerHTML = '已停止。可以再次点击按钮重新开始。';
            }
        }

        /* ================= 清理 ================= */
        function cleanupStream() {
            if (stream) {
                stream.getTracks().forEach(t => {
                    try { t.stop(); } catch (_) {}
                });
                stream = null;
            }
        }
        function cleanupAll() {
            cleanupStream();
            if (audioCtx) {
                audioCtx.close().catch(() => {});
                audioCtx = null;
            }
            analyser = null;
            source = null;
            freqBuf = null;
            timeBuf = null;
        }

        /* ================= 事件绑定 ================= */
        btnSys.addEventListener('click', () => startCapture('display'));
        btnMic.addEventListener('click', () => startCapture('mic'));
        btnStop.addEventListener('click', () => stop());
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', resize);

        /* ================= 初始化 ================= */
        resize();
        drawSilence();

        // 环境检测
        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
            btnSys.disabled = true;
            tip.innerHTML =
                '当前浏览器不支持 <b>getDisplayMedia</b>。<br>' +
                '请使用 <b>Chrome / Edge</b>，并在 <kbd>https</kbd> 或 <kbd>localhost</kbd> 环境下打开。';
        }
    })();
</script>
</body>
</html>
